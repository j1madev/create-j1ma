name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # GitHub deliberately does not trigger workflows on pull requests
          # opened with GITHUB_TOKEN, so release PRs reported no checks at all
          # and could never satisfy the `protect-main` ruleset - every release
          # had to be force merged with `gh pr merge --admin`. A PAT is a
          # normal actor, so its pull requests run CI like any other.
          #
          # Falls back to GITHUB_TOKEN, which restores the old behaviour rather
          # than failing the release outright if the secret is ever missing.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.release_created }}
      - run: npm install -g npm@latest
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm build
        if: ${{ steps.release.outputs.release_created }}
      - run: npm publish --provenance
        if: ${{ steps.release.outputs.release_created }}
