repository:
  name: create-j1ma
  description: Project initializer for React and Next.js apps.
  homepage: https://www.npmjs.com/package/create-j1ma
  topics: react, nextjs
  has_wiki: false
  private: false
  has_issues: true
  has_projects: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true
# `main` is governed by the `protect-main` and `No direct push to main`
# rulesets, configured under Settings > Rules. This file previously also
# declared classic branch protection for `main`, which never applied -
# `GET /repos/j1madev/create-j1ma/branches/main/protection` answered
# "Branch not protected" - so it only implied guarantees that were not
# there. Rulesets and classic protection are separate mechanisms; edit the
# ruleset, not this file.
